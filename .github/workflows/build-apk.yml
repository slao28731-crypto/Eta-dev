name: Build APK (self-signed)

# 二改构建流水线：使用仓库 Secret 中的固定签名证书，保证每次构建签名一致，
# 从而支持覆盖升级（不会丢数据）。证书丢失即无法发布可升级的新版本。

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug + assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 校验 Frida 安装命令
        shell: bash
        # 这条命令是几十段 Kotlin 字符串拼出来的，改一处就可能整段丢失或语法断裂。
        # 之前出现过「文档写了能力、实际命令被删空」的脱节，所以放进 CI 每次构建都验一遍。
        run: python3 ci/verify_frida_cli.py

      - name: 配置 JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: 配置 Android SDK 工具
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: 接受 SDK 许可
        shell: bash
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 安装 Android SDK 37
        shell: bash
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: 安装 NDK 30.0.16248370
        shell: bash
        run: sdkmanager "ndk;30.0.16248370"

      - name: 还原固定签名证书
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_B64}" ]]; then
            echo "::error::缺少 Secret ETA_RELEASE_KEYSTORE_BASE64，无法生成可覆盖升级的签名"
            exit 1
          fi
          echo "${KEYSTORE_B64}" | base64 -d > "$RUNNER_TEMP/eta-release.jks"
          # 立刻验证证书可读，避免编译到一半才发现口令错
          keytool -list -keystore "$RUNNER_TEMP/eta-release.jks" \
            -storepass "${STORE_PASS}" -alias "${KEY_ALIAS}" > /dev/null
          echo "证书已还原，SHA-256 指纹："
          keytool -list -v -keystore "$RUNNER_TEMP/eta-release.jks" \
            -storepass "${STORE_PASS}" -alias "${KEY_ALIAS}" | grep -E 'SHA256:|Valid from' || true

      - name: 构建 APK
        shell: bash
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-release.jks
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --no-configuration-cache --stacktrace \
            -Peta.buildMetadata=${GITHUB_SHA::7} \
            :app:assembleDebug :app:assembleRelease

      - name: 校验并重命名产物
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debug_apks=(app/build/outputs/apk/debug/*.apk)
          release_apks=(app/build/outputs/apk/release/*.apk)
          echo "debug count: ${#debug_apks[@]}"
          echo "release count: ${#release_apks[@]}"
          [[ ${#release_apks[@]} -ge 1 ]]

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner_path" verify --print-certs "${release_apks[0]}" || true

          mkdir -p "$RUNNER_TEMP/out"
          for f in "${debug_apks[@]}"; do cp "$f" "$RUNNER_TEMP/out/${f##*/}"; done
          for f in "${release_apks[@]}"; do cp "$f" "$RUNNER_TEMP/out/${f##*/}"; done
          ls -lh "$RUNNER_TEMP/out"

      - name: 上传 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eta-apk-${{ github.sha }}
          path: ${{ runner.temp }}/out/*.apk
          if-no-files-found: error
          retention-days: 30
