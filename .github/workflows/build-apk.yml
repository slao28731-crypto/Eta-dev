name: Build APK (self-signed)

# 二改构建流水线：使用仓库 Secret 中的固定签名证书，保证每次构建签名一致，
# 从而支持覆盖升级（不会丢数据）。证书丢失即无法发布可升级的新版本。

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug + assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 校验 Frida 安装命令
        shell: bash
        # 这条命令是几十段 Kotlin 字符串拼出来的，改一处就可能整段丢失或语法断裂。
        # 之前出现过「文档写了能力、实际命令被删空」的脱节，所以放进 CI 每次构建都验一遍。
        run: python3 ci/verify_frida_cli.py

      - name: 校验逆向分析工具组 profile
        shell: bash
        # 两个新 profile 的安装脚本同样是 Kotlin 拼接，且带 dependsOn 与资源名引用，
        # 任何一处写错都要到编译期或真机才暴露，这里提前挡掉。
        run: python3 ci/verify_re_lab_profiles.py

      - name: 校验 profile 声明顺序
        shell: bash
        # Kotlin object 属性按声明顺序初始化。`val ALL = listOf(..., RE_LAB)` 若写在
        # RE_LAB 之前，编译直接报 `Variable 'RE_LAB' must be initialized`。
        # 本地是 aarch64，跑不了 x86_64 的 aapt2，只能等 CI —— 一次往返十分钟，
        # 已经踩过两次（run #34 的 ALL、本轮的 RE_LAB_PIP_STEPS）。
        run: |
          python3 ci/verify_profile_decl_order.py
          python3 ci/self_test_profile_decl_order.py

      - name: 校验渗透工具组（URL 可达 + 脚本语法）
        shell: bash
        # 7 组共 20 多个下载步骤，URL 写错（gobuster 的 Linux 大写、
        # feroxbuster 的架构前置）只有真机才暴露。这里编译前先 HEAD 一遍。
        run: python3 ci/verify_pentest_toolkits.py

      - name: 本地静态检查（括号 / 资源 / import / shell 转义）
        shell: bash
        # 与本地跑的是同一个脚本，保证本地过 = CI 过。
        # 其中 shell 转义检查专门拦 run #37 那个坑：Kotlin 字符串里裸写
        # `$eta_bin` 会被当成模板插值，编译报 Unresolved reference。
        run: |
          python3 ci/static_check.py
          python3 ci/self_test_static_check.py

      - name: 配置 JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: 配置 Android SDK 工具
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: 接受 SDK 许可
        shell: bash
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 安装 Android SDK 37
        shell: bash
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: 安装 NDK 30.0.16248370
        shell: bash
        run: sdkmanager "ndk;30.0.16248370"

      - name: 还原固定签名证书
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_B64}" ]]; then
            echo "::error::缺少 Secret ETA_RELEASE_KEYSTORE_BASE64，无法生成可覆盖升级的签名"
            exit 1
          fi
          echo "${KEYSTORE_B64}" | base64 -d > "$RUNNER_TEMP/eta-release.jks"
          # 立刻验证证书可读，避免编译到一半才发现口令错
          keytool -list -keystore "$RUNNER_TEMP/eta-release.jks" \
            -storepass "${STORE_PASS}" -alias "${KEY_ALIAS}" > /dev/null
          echo "证书已还原，SHA-256 指纹："
          keytool -list -v -keystore "$RUNNER_TEMP/eta-release.jks" \
            -storepass "${STORE_PASS}" -alias "${KEY_ALIAS}" | grep -E 'SHA256:|Valid from' || true

      - name: 构建 APK
        shell: bash
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-release.jks
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew --no-daemon --no-configuration-cache --stacktrace \
            -Peta.buildMetadata=${GITHUB_SHA::7} \
            :app:assembleDebug :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
          rc=${PIPESTATUS[0]}
          echo "gradle exit=$rc"

          # 日志下载接口（GET /actions/jobs/{id}/logs）要 admin 权限，
          # artifact 下载要 token，脚本环境都拿不到。唯一公开可读的是
          # check-run annotation —— 所以把前几条错误写成 ::error::，
          # 之后用
          #   GET /repos/{owner}/{repo}/check-runs/{job_id}/annotations
          # 就能直接读到编译错误，不用等整份日志。
          # 这一招在 run #58 定位「参数加错函数」时救过一次，别再删。
          mapfile -t ERRS < <(grep -E "^e: " "$RUNNER_TEMP/build.log" | head -12)
          if [[ ${#ERRS[@]} -eq 0 ]]; then
            mapfile -t ERRS < <(grep -nE "error:|Unresolved reference|Cannot|FAILURE:" "$RUNNER_TEMP/build.log" | head -12)
          fi
          for line in "${ERRS[@]}"; do
            echo "::error title=GRADLE::$line"
          done
          exit $rc

      - name: 校验并重命名产物
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debug_apks=(app/build/outputs/apk/debug/*.apk)
          release_apks=(app/build/outputs/apk/release/*.apk)
          echo "debug count: ${#debug_apks[@]}"
          echo "release count: ${#release_apks[@]}"
          [[ ${#release_apks[@]} -ge 1 ]]

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner_path" verify --print-certs "${release_apks[0]}" || true

          mkdir -p "$RUNNER_TEMP/out"
          for f in "${debug_apks[@]}"; do cp "$f" "$RUNNER_TEMP/out/${f##*/}"; done
          for f in "${release_apks[@]}"; do cp "$f" "$RUNNER_TEMP/out/${f##*/}"; done
          ls -lh "$RUNNER_TEMP/out"

      - name: 上传 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eta-apk-${{ github.sha }}
          path: ${{ runner.temp }}/out/*.apk
          if-no-files-found: error
          retention-days: 30
