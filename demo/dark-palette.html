<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eta 深色配色调色台</title>
<style>
:root{
  --page:#242424;
  --bubble:#333333;
  --bubbleBd:rgba(255,255,255,0.10);
  --text:#F2F2F2;
  --dim:#9A9A9A;
  --accent:#4078EF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;padding:12px 12px 30px;background:#080808;color:#e8e8e8;
  font-family:-apple-system,"HarmonyOS Sans","PingFang SC","Noto Sans SC",system-ui,sans-serif;
}

/* ============ 顶部实时读数 ============ */
.readout{display:flex;gap:8px;margin-bottom:10px}
.chip{flex:1;min-width:0;border-radius:14px;padding:9px 11px;background:#161616;
  border:1px solid #262626;display:flex;align-items:center;gap:9px}
.sw{width:26px;height:26px;border-radius:9px;border:1px solid rgba(255,255,255,.18);flex:none;
  transition:background .15s}
.chip b{display:block;font-size:10px;font-weight:500;color:#8a8a8a;letter-spacing:.05em;margin-bottom:1px}
.chip span{font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.delta{flex:none;border-radius:14px;padding:9px 12px;background:#161616;border:1px solid #262626;text-align:center}
.delta b{display:block;font-size:10px;font-weight:500;color:#8a8a8a;letter-spacing:.05em;margin-bottom:1px}
.delta span{font-size:15px;font-variant-numeric:tabular-nums}
.delta.warn{border-color:#6b3a2a}
.delta.warn span{color:#FF9A6B}

/* ============ 手机预览 ============ */
.phone{width:100%;max-width:400px;margin:0 auto 14px;aspect-ratio:360/700;
  border-radius:24px;overflow:hidden;border:1px solid #2b2b2b;position:relative;
  box-shadow:0 14px 40px rgba(0,0,0,.6)}
.screen{position:absolute;inset:0;background:var(--page);display:flex;flex-direction:column;
  font-size:12px;transition:background .15s}
.statusbar{flex:none;height:26px;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;color:var(--text);font-size:11px;font-variant-numeric:tabular-nums}
.statusbar .r{display:flex;align-items:center;gap:5px;font-size:10px;opacity:.9}
.topbar{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.burger{display:flex;flex-direction:column;gap:4px}
.burger i{display:block;width:16px;height:1.6px;background:var(--text);border-radius:2px}
.dots{display:flex;gap:3.5px}
.dots i{display:block;width:3.4px;height:3.4px;border-radius:50%;background:var(--text)}

.msgs{flex:1;overflow:hidden;padding:6px 16px 0;display:flex;flex-direction:column;gap:14px}
.row{display:flex;width:100%}
.row.right{justify-content:flex-end}
.row.left{justify-content:flex-start}
.bubble{max-width:76%;padding:9px 13px;border-radius:16px;color:var(--text);
  line-height:1.55;font-size:13px;transition:background .15s,border-color .15s;
  border:1px solid transparent;word-break:break-word}
.bubble.user{background:var(--bubble);border-color:var(--bubbleBd)}
.bubble.ai{background:var(--bubble);border-color:var(--bubbleBd)}
.bubble.ai .sub{margin-top:9px}
.copyic{margin-top:10px;width:15px;height:15px;border:1.4px solid var(--dim);border-radius:3px;
  position:relative;opacity:.85}
.copyic:before{content:"";position:absolute;left:2.6px;top:2.6px;width:8px;height:8px;
  border:1.4px solid var(--dim);border-radius:2px;background:var(--page);transition:background .15s}
.bubble.off{background:transparent!important;border-color:transparent!important}

.inputbar{flex:none;padding:6px 14px 12px}
.inbox{border-radius:20px;background:var(--bubble);border:1px solid var(--bubbleBd);
  padding:10px 12px 8px;transition:background .15s,border-color .15s}
.inbox.off{background:transparent;border-color:rgba(255,255,255,.14)}
.inbox .ph{color:#8a8a8a;font-size:13px}
.tools{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.tools .ico{width:19px;height:19px;border-radius:50%;border:1.6px solid var(--dim);opacity:.9}
.tools .plus{position:relative;width:17px;height:17px}
.tools .plus:before,.tools .plus:after{content:"";position:absolute;background:var(--dim);border-radius:2px}
.tools .plus:before{left:0;top:7.6px;width:17px;height:1.6px}
.tools .plus:after{top:0;left:7.6px;height:17px;width:1.6px}
.tools .beta{width:19px;height:19px;border-radius:50%;border:1.8px solid var(--accent);opacity:.95}
.tools .mic{width:15px;height:15px;border-radius:8px 8px 5px 5px;border:1.6px solid var(--dim);opacity:.9}
.tools .ball{width:19px;height:19px;border-radius:50%;border:1.6px solid var(--dim);opacity:.9;position:relative}
.tools .ball:before{content:"";position:absolute;inset:4px;border-radius:50%;border:1.4px solid var(--dim)}
.tools .send{width:15px;height:15px;border-top:1.6px solid var(--dim);border-left:1.6px solid var(--dim);
  transform:rotate(45deg);opacity:.9;margin-right:3px}
.hint{position:absolute;left:0;right:0;bottom:0;padding:4px 0 5px;text-align:center;
  font-size:9px;color:#6d6d6d}

/* ============ 控制面板 ============ */
.panel{max-width:400px;margin:0 auto}
.grp{background:#131313;border:1px solid #262626;border-radius:16px;padding:12px 14px;margin-bottom:10px}
.lbl{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.lbl span{font-size:12.5px;color:#c9c9c9}
.lbl b{font-size:11.5px;color:#8a8a8a;font-variant-numeric:tabular-nums;font-weight:500}
input[type=range]{width:100%;height:26px;-webkit-appearance:none;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:4px;
  background:linear-gradient(90deg,#000,#5a5a5a,#b9b9b9)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:#fff;border:3px solid #242424;box-shadow:0 1px 6px rgba(0,0,0,.7);margin-top:-8px}
input[type=range]::-moz-range-track{height:6px;border-radius:4px;
  background:linear-gradient(90deg,#000,#5a5a5a,#b9b9b9)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;
  border:3px solid #242424;box-shadow:0 1px 6px rgba(0,0,0,.7)}

.presets{display:flex;gap:9px;flex-wrap:wrap;margin-top:4px}
.pre{flex:none;display:flex;align-items:center;gap:7px;border-radius:11px;padding:6px 10px 6px 7px;
  background:#1b1b1b;border:1px solid #2b2b2b;font-size:11px;color:#b9b9b9;cursor:pointer}
.pre:active{background:#252525}
.pre .dot{width:15px;height:15px;border-radius:50%;border:1px solid rgba(255,255,255,.2);flex:none}

.seg{display:flex;gap:7px;margin-top:2px}
.seg button{flex:1;padding:9px 6px;border-radius:11px;background:#1b1b1b;border:1px solid #2b2b2b;
  color:#b9b9b9;font-size:11.5px;cursor:pointer;font-family:inherit}
.seg button.on{background:#2b2b2b;border-color:#4a4a4a;color:#fff}

.actions{display:flex;gap:9px;margin-top:2px}
.btn{flex:1;padding:13px;border-radius:14px;border:none;font-size:13.5px;font-family:inherit;
  font-weight:500;cursor:pointer}
.btn.primary{background:#3C7EF0;color:#fff}
.btn.ghost{background:#1e1e1e;color:#c9c9c9;border:1px solid #2e2e2e}
.tip{font-size:11px;color:#777;line-height:1.7;margin:10px 2px 0}
.tip b{color:#9a9a9a;font-weight:500}

#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);opacity:0;
  background:rgba(48,48,48,.96);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;
  pointer-events:none;transition:.22s;z-index:99;border:1px solid #3d3d3d}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="readout">
  <div class="chip">
    <div class="sw" id="swPage"></div>
    <div><b>页面背景</b><span id="vPage">#242424</span></div>
  </div>
  <div class="chip">
    <div class="sw" id="swBubble"></div>
    <div><b>气泡 / 卡片</b><span id="vBubble">#333333</span></div>
  </div>
  <div class="delta" id="deltaBox">
    <b>ΔL</b><span id="vDelta">8.4%</span>
  </div>
</div>

<!-- ================= 预览 ================= -->
<div class="phone">
  <div class="screen" id="screen">
    <div class="statusbar">
      <div>23:49 &#9673; &#8943;</div>
      <div class="r"><span>40.9</span><span>VPN</span><span>&#9736;</span><span>5G</span><span>78</span></div>
    </div>
    <div class="topbar">
      <div class="burger"><i></i><i></i><i></i></div>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
    <div class="msgs">
      <div class="row right"><div class="bubble user" id="bUser">你好</div></div>
      <div class="row left">
        <div class="bubble ai" id="bAi">
          <div>Runtime 运行失败</div>
          <div class="sub">请先配置 API Key</div>
          <div class="copyic"></div>
        </div>
      </div>
    </div>
    <div class="inputbar">
      <div class="inbox" id="inbox">
        <div class="ph">交给 Eta 去完成</div>
        <div class="tools">
          <div class="plus"></div>
          <div class="beta"></div>
          <div class="ico"></div>
          <div class="mic"></div>
          <div class="ball"></div>
          <div class="send"></div>
        </div>
      </div>
    </div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<!-- ================= 控制 ================= -->
<div class="panel">

  <div class="grp">
    <div class="lbl"><span>页面背景亮度</span><b id="pagePct">14.1%</b></div>
    <input type="range" id="pageRange" min="0" max="40" step="0.5" value="14">
    <div class="presets" id="pagePresets"></div>
  </div>

  <div class="grp">
    <div class="lbl"><span>气泡 / 卡片亮度</span><b id="bubblePct">20.0%</b></div>
    <input type="range" id="bubbleRange" min="0" max="45" step="0.5" value="20">
    <div class="presets" id="bubblePresets"></div>
  </div>

  <div class="grp">
    <div class="lbl"><span>气泡分离方式</span><b id="modeName">实心色</b></div>
    <div class="seg" id="modeSeg">
      <button data-mode="solid" class="on">实心色</button>
      <button data-mode="alpha">半透明白</button>
      <button data-mode="line">只描边</button>
    </div>
  </div>

  <div class="grp">
    <div class="lbl"><span>对比开关</span><b>看看气泡有没有被吃掉</b></div>
    <div class="seg" id="toggleSeg">
      <button data-t="on" class="on">显示气泡底</button>
      <button data-t="off">隐藏气泡底</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn primary" id="copyBtn">复制色值发给你</button>
    <button class="btn ghost" id="resetBtn">恢复现状</button>
  </div>

  <div class="tip">
    <b>ΔL</b> 是气泡与页面的亮度差。低于 <b>3%</b> 基本看不出气泡边界，就是你截图里「气泡被背景覆盖」的状态。<br>
    <b>页面背景</b>决定了整片底，<b>气泡</b>要比它亮一档才浮得起来。<br>
    <b>半透明白</b>模式下气泡自动叠在页面色上，换任何页面色都不会撞色，最省心。
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  var pageL = 14, bubbleL = 20, mode = 'solid', showBubble = true;

  var elPage = document.getElementById('swPage');
  var elBubble = document.getElementById('swBubble');
  var vPage = document.getElementById('vPage');
  var vBubble = document.getElementById('vBubble');
  var vDelta = document.getElementById('vDelta');
  var deltaBox = document.getElementById('deltaBox');
  var pagePct = document.getElementById('pagePct');
  var bubblePct = document.getElementById('bubblePct');
  var hint = document.getElementById('hint');
  var bUser = document.getElementById('bUser');
  var bAi = document.getElementById('bAi');
  var inbox = document.getElementById('inbox');

  function gray(L){
    var v = Math.round(L / 100 * 255);
    v = Math.max(0, Math.min(255, v));
    return v;
  }
  function hexOf(v){
    var s = v.toString(16).toUpperCase();
    return '#' + (s.length < 2 ? '0' + s : s) + (s.length < 2 ? '0' + s : s) + (s.length < 2 ? '0' + s : s);
  }
  function hex(L){ return hexOf(gray(L)); }

  /* 页面预设 */
  var pagePresets = [
    {n:'纯黑', L:0},
    {n:'#1A', L:10},
    {n:'现状 #24', L:14},
    {n:'#2B', L:17},
    {n:'#33', L:20}
  ];
  /* 气泡预设：相对页面提亮 */
  var bubblePresets = [
    {n:'无差', L:14},
    {n:'+4', L:18},
    {n:'+6', L:20},
    {n:'+9', L:23},
    {n:'+13', L:27},
    {n:'+18', L:32}
  ];

  function buildPresets(box, list, cur, apply){
    box.innerHTML = '';
    list.forEach(function(p){
      var d = document.createElement('div');
      d.className = 'pre';
      d.innerHTML = '<span class="dot" style="background:' + hex(p.L) + '"></span>' + p.n;
      d.onclick = function(){ apply(p.L); };
      box.appendChild(d);
    });
  }

  function render(){
    var pv = gray(pageL), bv = gray(bubbleL);
    var phex = hex(pageL), bhex = hex(bubbleL);

    document.documentElement.style.setProperty('--page', phex);
    vPage.textContent = phex;
    elPage.style.background = phex;
    pagePct.textContent = (pageL / 100 * 100).toFixed(1) + '%';

    /* 气泡颜色取决于模式 */
    var bubCss, bubBd;
    if (mode === 'solid'){
      bubCss = bhex;
      bubBd = 'rgba(255,255,255,0.10)';
    } else if (mode === 'alpha'){
      var a = Math.max(0.03, (bubbleL - pageL) / 100);
      bubCss = 'rgba(255,255,255,' + a.toFixed(3) + ')';
      bubBd = 'rgba(255,255,255,0.10)';
    } else {
      bubCss = 'transparent';
      bubBd = 'rgba(255,255,255,0.16)';
    }
    document.documentElement.style.setProperty('--bubble', bubCss);
    document.documentElement.style.setProperty('--bubbleBd', bubBd);

    vBubble.textContent = bhex;
    elBubble.style.background = (mode === 'solid') ? bhex : 'rgba(255,255,255,0.14)';
    bubblePct.textContent = (bubbleL / 100 * 100).toFixed(1) + '%';

    /* 对比开关 */
    var off = !showBubble;
    [bUser, bAi].forEach(function(el){ el.classList.toggle('off', off); });
    inbox.classList.toggle('off', off);

    /* ΔL */
    var d = Math.abs(bubbleL - pageL);
    vDelta.textContent = d.toFixed(1) + '%';
    deltaBox.classList.toggle('warn', d < 3);

    if (off){
      hint.textContent = '气泡底已隐藏 —— 这就是你截图里的样子';
    } else if (d < 3){
      hint.textContent = 'ΔL ' + d.toFixed(1) + '%：气泡几乎看不见，被背景吃掉';
    } else if (d < 6){
      hint.textContent = 'ΔL ' + d.toFixed(1) + '%：有边界，但很轻';
    } else {
      hint.textContent = 'ΔL ' + d.toFixed(1) + '%：气泡清晰浮起';
    }
  }

  /* ---------- 事件 ---------- */
  document.getElementById('pageRange').oninput = function(e){
    pageL = parseFloat(e.target.value);
    render();
  };
  document.getElementById('bubbleRange').oninput = function(e){
    bubbleL = parseFloat(e.target.value);
    render();
  };

  document.getElementById('modeSeg').onclick = function(e){
    var b = e.target.closest('button');
    if (!b) return;
    mode = b.dataset.mode;
    [].forEach.call(this.children, function(c){ c.classList.toggle('on', c === b); });
    document.getElementById('modeName').textContent = b.textContent;
    render();
  };

  document.getElementById('toggleSeg').onclick = function(e){
    var b = e.target.closest('button');
    if (!b) return;
    showBubble = b.dataset.t === 'on';
    [].forEach.call(this.children, function(c){ c.classList.toggle('on', c === b); });
    render();
  };

  document.getElementById('resetBtn').onclick = function(){
    pageL = 14; bubbleL = 14; mode = 'solid'; showBubble = true;
    document.getElementById('pageRange').value = 14;
    document.getElementById('bubbleRange').value = 14;
    [].forEach.call(document.getElementById('modeSeg').children, function(c){
      c.classList.toggle('on', c.dataset.mode === 'solid');
    });
    [].forEach.call(document.getElementById('toggleSeg').children, function(c){
      c.classList.toggle('on', c.dataset.t === 'on');
    });
    document.getElementById('modeName').textContent = '实心色';
    render();
    toast('已恢复现状：页面 #242424 / 气泡 #242424（无差）');
  };

  /* ---------- 复制 ---------- */
  function payload(){
    var mName = mode === 'solid' ? '实心色' : (mode === 'alpha' ? '半透明白' : '只描边');
    var s = '页面背景 ' + hex(pageL) + ' (' + (pageL).toFixed(1) + '%)' +
            ' · 气泡 ' + hex(bubbleL) + ' (' + (bubbleL).toFixed(1) + '%)' +
            ' · 模式 ' + mName + ' · ΔL ' + Math.abs(bubbleL - pageL).toFixed(1) + '%';
    return s;
  }
  function toast(t){
    var el = document.getElementById('toast');
    el.textContent = t;
    el.classList.add('show');
    clearTimeout(window.__tt);
    window.__tt = setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }
  function fallbackCopy(t){
    var ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('已复制，直接发给我'); }
    catch(e){ toast(t); }
    document.body.removeChild(ta);
  }
  document.getElementById('copyBtn').onclick = function(){
    var t = payload();
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){ toast('已复制，直接发给我'); },
        function(){ fallbackCopy(t); });
    } else {
      fallbackCopy(t);
    }
  };

  /* ---------- 初始 ---------- */
  buildPresets(document.getElementById('pagePresets'), pagePresets, pageL, function(L){
    pageL = L;
    document.getElementById('pageRange').value = L;
    render();
  });
  buildPresets(document.getElementById('bubblePresets'), bubblePresets, bubbleL, function(L){
    bubbleL = L;
    document.getElementById('bubbleRange').value = L;
    render();
  });
  render();
})();
</script>
</body>
</html>
